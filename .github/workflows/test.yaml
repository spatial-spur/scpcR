name: Tests

on:
  push:
    branches: [main, rust-core]
  pull_request:
    branches: [main, rust-core]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['0', '1']

    runs-on: ${{ matrix.os }}
    env:
      SPATIAL_RUST: ${{ matrix.rust }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Rust target for Rtools
        if: runner.os == 'Windows' && matrix.rust == '1'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::fixest, any::geodist, any::RSpectra
          cache-version: rust-${{ matrix.rust }}

      - name: Run tests
        run: >-
          Rscript -e 'pkgload::load_all(quiet = TRUE);
          stopifnot(is.loaded("wrap__rust_run_exact_scpc", PACKAGE = "scpcR") == (Sys.getenv("SPATIAL_RUST") == "1"));
          testthat::test_local(stop_on_failure = TRUE)'
